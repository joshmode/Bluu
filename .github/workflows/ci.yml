name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p bluu-core
      - run: cargo clippy -p bluu-core --all-targets -- -D warnings

  workspace:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p bluu-provider-demo
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check

  native-host-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native/owb -B build/native-host
      - run: cmake --build build/native-host --target owb_driver_tests
      - run: build/native-host/tests/driver/owb_driver_tests
      - name: Strict C syntax checks
        run: |
          clang -std=c11 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror \
            -Inative/owb/driver/src -Inative/owb/driver -fsyntax-only \
            native/owb/driver/src/avdtp_packets.c \
            native/owb/driver/src/avdtp_state.c \
            native/owb/driver/src/recv_queue.c

  provider-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace --target x86_64-pc-windows-msvc
      - name: Copy native provider adapter into packaged provider directory
        shell: pwsh
        run: |
          Copy-Item "target\x86_64-pc-windows-msvc\release\bluu-provider-owb.exe" "providers\bluu-native-a2dp\bluu-provider-owb.exe" -Force
      - name: No-headset provider smoke
        shell: pwsh
        run: .\scripts\windows\smoke-provider.ps1

  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --target x86_64-pc-windows-msvc
      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo test -p bluu-platform -p bluu-core
      - run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources
          arguments: --all-features

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test -p bluu-platform screenshot
